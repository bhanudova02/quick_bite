<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script>
        function bodyLoad() {
            var inputValue = prompt("Enter Input Type").trim()
            var input = document.getElementById("input");
            if (inputValue == "text" || inputValue == "password" || inputValue == "color" || inputValue == "password") {
                input.type=inputValue
            }else{
                alert("Invalid input type. Please refresh and try again.");
                input.disabled=true;
            }
        }
    </script>
</head>
<body onload="bodyLoad()" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <input id="input" type="">
</body>
</html>
